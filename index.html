<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素数当てゲーム</title>

<style>
:root{
  --bg:#0f1115;
  --card:#1a1d24;
  --text:#ffffff;
  --ok:#4caf50;
  --ng:#ff5252;
}

*{box-sizing:border-box;}

/* ===== 追加：スクロール完全禁止 ===== */
html, body{
  margin:0;
  height:100dvh;
  overflow:hidden;          /* ←これが本体 */
  position:fixed;
  width:100%;
  overscroll-behavior:none; /* iOS/Androidバウンス対策 */
}
/* =========================== */

body{
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif;
}

/* ホーム */
#home{
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:16px;
  padding:20px;
}

h1{
  text-align:center;
  font-size:2rem;
}

button{
  width:100%;
  padding:16px;
  font-size:1.2rem;
  border:none;
  border-radius:12px;
  background:#2a2f3a;
  color:white;
}

.oddWrap{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.2rem;
}

#oddMode{
  width:24px;
  height:24px;
}

/* ゲーム */
#game{
  display:none;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:16px;
}

/* 上部 */
.header{
  display:flex;
  justify-content:space-between;
  font-size:1.2rem;
}

/* タイマー */
#timer{
  text-align:center;
  font-size:1.6rem;
  margin-top:4px;
}

/* 問題 */
.question{
  text-align:center;
  font-size:2rem;
  margin:10px 0;
}

/* 選択肢 */
#choices{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:14px;
}

@media (orientation: landscape) and (min-width:700px){
  #choices{ flex-direction:row; }
}

.choice{
  flex:1;
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2rem;
  border-radius:14px;
  background:#2a2f3a;
}

/* フッター */
.footer{
  height:100px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#result{
  font-size:1.8rem;
  height:40px;
}

.ok{color:var(--ok);}
.ng{color:var(--ng);}

/* リザルト */
.resultCard{
  margin:20px;
  padding:16px;
  background:var(--card);
  border-radius:16px;
}

.modeInfo{
  text-align:center;
  font-size:1.2rem;
  margin-bottom:6px;
}

.bigRate{
  font-size:2.4rem;
  text-align:center;
  margin:10px 0;
}

.resultScore{
  text-align:center;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:6px;
  border-bottom:1px solid #333;
  text-align:center;
}

tr:nth-child(even){
  background:#16181f;
}
</style>
</head>

<body>

<div id="home">
  <h1>素数を当てよう</h1>
  <button onclick="startGame(100)">初級（1〜100）</button>
  <button onclick="startGame(500)">中級（1〜500）</button>
  <button onclick="startGame(1000)">上級（1〜1000）</button>
  <button onclick="startGame(10000)">超上級（1〜10000）</button>

  <label class="oddWrap">
    <input type="checkbox" id="oddMode">
    奇数のみモード
  </label>
</div>

<div id="game"></div>

<script>
let correct,count,score,max,history,odd=false;
let startTime, timerInterval, elapsed=0, miss=0;
let modeLabel="";

function initGameUI(){
  document.getElementById("game").innerHTML=`
    <div class="header">
      <div id="progress">1 / 10</div>
      <div id="score">0点</div>
    </div>

    <div id="timer">0.000 秒</div>

    <div class="question">どれが素数？</div>

    <div id="choices"></div>

    <div class="footer">
      <div id="result"></div>
      <button id="next" onclick="next()" style="display:none;">次へ</button>
    </div>
  `;
}

function resetGame(){
  correct=null;
  count=0;
  score=0;
  history=[];
  miss=0;
  elapsed=0;
  clearInterval(timerInterval);
}

function startTimer(){
  startTime = performance.now();
  timerInterval = setInterval(()=>{
    elapsed = (performance.now() - startTime) / 1000;
    document.getElementById("timer").textContent = elapsed.toFixed(3) + " 秒";
  },10);
}

function stopTimer(){
  clearInterval(timerInterval);
}

function isPrime(n){
  if(n<2)return false;
  for(let i=2;i<=Math.sqrt(n);i++){
    if(n%i===0)return false;
  }
  return true;
}

function rand(max){return Math.floor(Math.random()*max)+1;}
function randOdd(max){let n;do{n=rand(max);}while(n%2===0);return n;}

function generate(){
  let p;
  do{ p = odd?randOdd(max):rand(max);}while(!isPrime(p));
  let arr=[p];

  while(arr.length<3){
    let n = odd?randOdd(max):rand(max);
    if(!arr.includes(n)&&!isPrime(n)) arr.push(n);
  }
  return arr.sort(()=>Math.random()-0.5);
}

function startGame(m){
  max=m;
  odd=document.getElementById("oddMode").checked;

  modeLabel = (odd ? "奇数のみモード" : "通常モード") + ` / 1〜${max}`;

  resetGame();
  initGameUI();

  document.getElementById("home").style.display="none";
  document.getElementById("game").style.display="flex";

  startTimer();
  next();
}

function next(){
  if(count>=10){finish();return;}

  count++;
  document.getElementById("progress").textContent=`${count} / 10`;
  document.getElementById("score").textContent=`${score}点`;

  let nums=generate();
  correct=nums.find(isPrime);

  let area=document.getElementById("choices");
  let result=document.getElementById("result");

  area.innerHTML="";
  result.textContent="";
  result.className="";
  document.getElementById("next").style.display="none";

  nums.forEach(n=>{
    let b=document.createElement("button");
    b.className="choice";
    b.textContent=n;

    b.onclick=()=>{
      let ok=(n===correct);

      if(ok){
        score++;
        result.textContent="正解";
        result.className="ok";
      }else{
        miss++;
        result.textContent="不正解";
        result.className="ng";
      }

      history.push({
        q:count,
        answer:n,
        correct:correct,
        result:ok?"○":"×"
      });

      document.querySelectorAll(".choice").forEach(x=>x.disabled=true);
      document.getElementById("next").style.display="block";
    };

    area.appendChild(b);
  });
}

function finish(){
  stopTimer();

  let rate = 1000 / (elapsed + miss*4);

  let html=`
  <div class="resultCard">
    <div class="modeInfo">${modeLabel}</div>
    <div class="bigRate">レート ${rate.toFixed(2)}</div>
    <div class="resultScore">
      時間: ${elapsed.toFixed(3)}秒 / ミス: ${miss}
    </div>

    <table>
      <tr><th>#</th><th>回答</th><th>正解</th><th>判定</th></tr>
  `;

  history.forEach(h=>{
    html+=`
    <tr>
      <td>${h.q}</td>
      <td>${h.answer}</td>
      <td>${h.correct}</td>
      <td>${h.result}</td>
    </tr>`;
  });

  html+=`</table>
  <button onclick="back()">ホームへ戻る</button>
  </div>`;

  document.getElementById("game").innerHTML=html;
}

function back(){
  resetGame();
  document.getElementById("game").style.display="none";
  document.getElementById("home").style.display="flex";
}
</script>

</body>
</html>
